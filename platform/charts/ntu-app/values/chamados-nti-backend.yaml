replicaCount: 2

image:
  repository: cloudlabhost/chamados-nti-backend
  tag: 65ea5fa21c4aca90f0feae963ef24307496d3c43
  pullPolicy: IfNotPresent

envFrom:
  - secretRef:
      name: chamados-backend-secret

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - chamados-nti-backend
          topologyKey: kubernetes.io/hostname

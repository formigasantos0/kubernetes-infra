apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chamados-nti
  namespace: argocd

spec:
  project: ntu-apps

  source:
    repoURL: https://github.com/formigasantos0/kubernetes-infra.git
    targetRevision: main
    path: platform/charts/ntu-app

    helm:
      releaseName: chamados-nti

      valueFiles:
        - values/chamados-nti.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: chamados-nti

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chamados-nti-infra
  namespace: argocd
spec:
  project: ntu-apps

  source:
    repoURL: https://github.com/formigasantos0/kubernetes-infra.git
    targetRevision: main
    path: apps/chamados-nti

  destination:
    server: https://kubernetes.default.svc
    namespace: chamados-nti

  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true

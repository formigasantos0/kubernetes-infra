apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntu-apps-bootstrap
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/formigasantos0/kubernetes-infra.git
    targetRevision: main
    path: argocd/bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
